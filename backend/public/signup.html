<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1E6B52" />
  <title>Sign up — Placement Assistant</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <div class="auth-shell">
    <aside class="auth-side">
      <a href="/index.html" class="brand brand-on-dark">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="white" />
          <path d="M9 20a7 7 0 0 1 14 0" stroke="#1E6B52" stroke-width="2.5" stroke-linecap="round" fill="none" />
          <circle cx="16" cy="20" r="1.6" fill="#1E6B52" />
        </svg>
        Placement Assistant
      </a>
      <p class="auth-side-quote">"Know exactly what's missing <span>before you hit submit.</span>"</p>
      <p class="auth-side-foot">© 2026 Placement Assistant</p>
    </aside>

    <main class="auth-main">
      <div class="auth-box">
        <a href="/index.html" class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" rx="9" fill="currentColor" />
            <path d="M9 20a7 7 0 0 1 14 0" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" />
            <circle cx="16" cy="20" r="1.6" fill="white" />
          </svg>
          Placement Assistant
        </a>

        <h1 class="auth-heading">Create your account</h1>
        <p class="auth-subheading">Free to get started — no credit card needed.</p>
        <p class="form-message" id="signup-message"></p>

        <form id="signup-form" novalidate>
          <div class="field">
            <label class="field-label" for="name">Full name</label>
            <input class="input" type="text" id="name" name="name" autocomplete="name" placeholder="Jordan Lee" required />
          </div>
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label class="field-label" for="password">Password</label>
            <input class="input" type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-block btn-lg" id="signup-btn" style="margin-top: 0.5rem;">Create account</button>
        </form>

        <p class="auth-foot">Already have an account? <a href="/login.html">Log in</a></p>
        <p style="text-align: center; margin-top: var(--space-4); font-size: var(--fs-tiny); color: var(--ink-faint);">
          <a href="/about.html" style="color: inherit;">About</a> · <a href="mailto:dashinghero20050506@gmail.com" style="color: inherit;">Contact us</a>
        </p>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
