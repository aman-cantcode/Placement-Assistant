<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Placement Assistant</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Placement Assistant</span>
    <button id="logout-btn" class="btn-secondary">Log out</button>
  </header>

  <main class="container">
    <div class="grid-2">
      <section class="card">
        <h2>My Profile</h2>
        <form id="profile-form">
          <label>Name
            <input type="text" name="name" required />
          </label>
          <label>Branch
            <input type="text" name="branch" placeholder="e.g. CSE" />
          </label>
          <label>CGPA
            <input type="number" name="cgpa" step="0.01" min="0" max="10" />
          </label>
          <label>Skills (comma separated)
            <input type="text" name="skills" placeholder="e.g. JavaScript, Python, SQL" />
          </label>
          <label>Target companies (comma separated)
            <input type="text" name="targetCompanies" placeholder="e.g. Amazon, Google" />
          </label>
          <p class="error" id="profile-error"></p>
          <p class="success" id="profile-success"></p>
          <button type="submit">Save profile</button>
        </form>
      </section>

      <div>
        <section class="card">
          <h2>Resume</h2>
          <p id="resume-info" class="muted">No resume uploaded yet.</p>
          <form id="resume-form">
            <input type="file" name="resume" accept=".pdf,.docx" required />
            <p class="error" id="resume-error"></p>
            <p class="success" id="resume-success"></p>
            <button type="submit">Upload resume</button>
          </form>
        </section>

        <section class="card">
          <h2>New JD Analysis</h2>
          <form id="history-form">
            <label>Name this analysis
              <input type="text" name="title" placeholder="e.g. SDE - Amazon" required />
            </label>
            <label>Job description
              <textarea name="jdText" rows="7" placeholder="Paste the full job description here..." required></textarea>
            </label>
            <p class="error" id="history-error"></p>
            <button type="submit">Analyze</button>
          </form>
        </section>
      </div>
    </div>

    <section class="card">
      <h2>My Analyses</h2>
      <div id="history-list"><p class="muted">Loading...</p></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
