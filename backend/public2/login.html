<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Placement Assistant</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="card auth-card">
      <h1>Placement Assistant</h1>
      <p class="muted">Log in to your account</p>
      <form id="login-form">
        <label>Email
          <input type="email" name="email" required />
        </label>
        <label>Password
          <input type="password" name="password" required />
        </label>
        <p class="error" id="error"></p>
        <button type="submit">Log in</button>
      </form>
      <p class="muted"><a href="/forgot-password.html">Forgot password?</a></p>
      <p class="muted">New here? <a href="/signup.html">Create an account</a></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
